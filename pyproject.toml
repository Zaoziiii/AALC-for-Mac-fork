[project]
name = "ahab-assistant-limbus-company"
description = "Ahab Assistant for Limbus Company: automation helper (GUI, OCR, tasks)."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "KIYI671" }]
keywords = ["limbus", "automation", "pyqt", "ocr", "game-assistant"]
requires-python = ">=3.12"
version = "1.0.9"

dependencies = [
    'PySide6==6.9.2',
    'PySide6-Fluent-Widgets==1.9.1',
    'PyAutoGUI==0.9.54',
    'pynput==1.8.1',
    'pyperclip==1.10.0',
    'playsound3==3.2.6',
    'requests==2.32.5',
    'packaging==25.0',
    'markdown-it-py==4.0.0',
    'mdit-py-plugins==0.5.0',
    'linkify-it-py==2.0.3',
    'ruamel.yaml==0.18.15',
    'numpy==2.3.3',
    'opencv-python-headless==4.11.0.86',
    'Pillow>=12.1,<13',
    'psutil==7.1.0',
    'onnxruntime==1.20.1',
    'concurrent-log-handler==0.9.28',
    'colorlog==6.9.0',
    'rapidocr==3.4.1',
    'tzdata==2025.2',
    'pydantic==2.12.5',
    'pyobjc-framework-Quartz>=11,<13',
    'pyobjc-framework-Cocoa>=11,<13',
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=9.1.0",
    "ruff>=0.13.1",
    "watchdog",
]

[project.urls]
Homepage = "https://github.com/KIYI671/AhabAssistantLimbusCompany"
Source = "https://github.com/KIYI671/AhabAssistantLimbusCompany"
Issues = "https://github.com/KIYI671/AhabAssistantLimbusCompany/issues"

[tool.uv]
managed = true
override-dependencies = ["opencv-python; python_version < '0'"]

# used by `pyside6-project lupdate`
[tool.pyside6-project]
files = [
    "main.py",
    "app/__init__.py",
    "app/my_app.py",
    "app/page_card.py",
    "app/setting_interface.py",
    "app/farming_interface.py",
    "app/tools_interface.py",
    "app/team_setting_card.py",
    "app/common/ui_config.py",
    "app/starlight_bonus.py",
    "app/base_combination.py",
    "app/card/messagebox_custom.py",
    "app/base_tools.py",
    "app/language_manager.py",
    "app/windows_toast.py",
    "app/announcement_board.py",
    "module/update/check_update.py",
    "tasks/base/script_task_scheme.py",
    "tasks/tools/production_module.py",
    "app/theme_pack_setting_interface.py",
    "i18n/myapp_en.ts",
]

[tool.ruff.lint]
# 启用规则集 (E: pycodestyle, F: Pyflakes, I: isort)
# T201: 禁止使用print进行调试
select = ["E", "F", "I", "T201"]
# 忽略特定的规则
ignore = ["E501"]
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
